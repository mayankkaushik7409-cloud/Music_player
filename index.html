<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Music Player</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background: linear-gradient(45deg, #6a11cb, #2575fc, #ff6a00, #d64550);
            background-size: 300% 300%;
            animation: gradientShift 15s ease infinite;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #player-controls {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.8s ease-in-out;
        }
        
        @keyframes scaleUp {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .button {
            background: #2575fc;
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .button:hover {
            background: #6a11cb;
            transform: translateY(-5px);
            animation: buttonHover 0.4s ease-out;
        }
        
        @keyframes buttonHover {
            0% {
                box-shadow: 0 0 15px #6a11cb;
            }
            100% {
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }
        }
        
        .button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        
        #progress-bar {
            width: 100%;
            height: 5px;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
            position: relative;
        }
        
        #progress-bar span {
            display: block;
            height: 100%;
            background-color: #4CAF50;
            width: 0;
            border-radius: 5px;
            transition: width 0.2s;
        }
        
        .slider {
            width: 100%;
            margin: 15px 0;
            height: 8px;
            background-color: #ddd;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        .slider::-webkit-slider-thumb {
            background-color: #4CAF50;
            border: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .slider:hover {
            background-color: #6a11cb;
        }
        
        #playlist {
            background-color: #2575fc;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        
        #playlist option {
            background-color: #0eaf0e;
            padding: 10px;
            color: white;
        }
        
        #playlist:focus {
            outline: none;
            transform: scale(1.05);
            background-color: #2575fc;
        }
        
        @media (max-width: 600px) {
            #player-controls {
                width: 90%;
            }
            h1 {
                font-size: 2rem;
            }
            .button {
                width: 100%;
            }
            .slider {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>Advanced Music Player</h1>

    <!-- Audio Player -->
    <audio id="audio-player" preload="auto">
        <source id="audio-source" src="./songs/1.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <!-- Controls -->
    <div id="player-controls">
        <button id="prev-btn" class="button">Previous</button>
        <button id="play-btn" class="button">Play</button>
        <button id="pause-btn" class="button">Pause</button>
        <button id="next-btn" class="button">Next</button>
        <br><br>
        <input id="volume-control" class="slider" type="range" min="0" max="1" step="0.01" value="1">
        <label for="volume-control">Volume</label>
        <br><br>
        <div id="progress-bar">
            <span id="progress"></span>
        </div>
        <br><br>
        <select id="playlist">
          <audio src="./songs/2.mp3"></audio>
          <audio src="./songs/3.mp3"></audio>
          <audio src="./songs/5.mp3"></audio>

        </select>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const volumeControl = document.getElementById('volume-control');
        const progressBar = document.getElementById('progress-bar');
        const progressSpan = document.getElementById('progress');
        const playlist = document.getElementById('playlist');

        const songs = [
            "./songs/Imagine_Dragons_-_Believer__.mp3",
            "./songs/Darkside_×_Aaja_Sanam_Song_.mp3",
            "./songs/1.mp3",
            "./songs/Give it all away.mp3",
            "./songs/Dheere dheere.mp3",
            "./songs/Brown Rang.mp3",
            "./songs/Braat.mp3",
            "songs/Diamond________.mp3",
            "songs/Dil_Galti_Kar_Baitha_Hai.mp3",
            "./songs/FIGHTER__Bekaar_Dil__.mp3",
            "./songs/FIGHTER__Heer_Aasmani).mp3",
            "./songs/Eye_Candy__Full.mp3",
            "./songs/Guru_Randhawa__Downtown__).mp3",
            "./songs/Kabhi_Jo_badal_barshe___.mp3",
            "./songs/Main_Dhoondne ko).mp3",
            "songs/Attitude_😈_LOFI__.mp3",
            "songs/SHADOW___Singga_).mp3",

        ];
        let currentSongIndex = 0;

        function playMusic() {
            audioPlayer.play();
            playBtn.disabled = true;
            pauseBtn.disabled = false;
        }

        function pauseMusic() {
            audioPlayer.pause();
            playBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressSpan.style.width = progress + '%';
        });

        volumeControl.addEventListener('input', () => {
            audioPlayer.volume = volumeControl.value;
        });

        prevBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            changeSong();
        });

        nextBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            changeSong();
        });

        function changeSong() {
            const song = songs[currentSongIndex];
            audioPlayer.src = song;
            audioPlayer.load();
            playMusic();
        }

        playlist.addEventListener('change', () => {
            const selectedSong = playlist.value;
            audioPlayer.src = selectedSong;
            audioPlayer.load();
            playMusic();
        });

        window.onload = function() {
            audioPlayer.src = songs[currentSongIndex];

            songs.forEach(song => {
                const option = document.createElement('option');
                option.value = song;
                option.textContent = song.split('/').pop().replace('.mp3', '');
                playlist.appendChild(option);
            });
        };

        playBtn.addEventListener('click', playMusic);
        pauseBtn.addEventListener('click', pauseMusic);

        progressBar.addEventListener('click', (event) => {
            const clickPosition = (event.offsetX / progressBar.offsetWidth) * audioPlayer.duration;
            audioPlayer.currentTime = clickPosition;
        });
    </script>

</body>

</html>
